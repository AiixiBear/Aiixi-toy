; PlatformIO Project Configuration File
;
; Aiixi-toy - ESP32 TOTP Authenticator for M5StickC / M5StickC Plus
;
; Build instructions:
;   1. Install PlatformIO (VS Code extension or CLI)
;   2. Open this project folder
;   3. Build: pio run
;   4. Upload: pio run --target upload
;
; For OTA updates, the 'min_spiffs' partition scheme is used on the
; 4MB M5StickC. The M5StickC Plus 2 has 8MB Flash, so its env uses
; partitions-8mb-photos.csv instead: same 1.875MB app slots, but the
; SPIFFS partition grows to 4.125MB for the photo frame. Changing the
; partition table needs a full erase + USB reflash, it cannot be done
; over OTA, and it wipes NVS (TOTP keys, PIN, WiFi settings) and photos.

[env:m5stick-c]
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino

; Minimal SPIFFS partition scheme (required for OTA updates)
board_build.partitions = min_spiffs.csv

; Monitor settings
monitor_speed = 115200

; Library dependencies
lib_deps = 
    m5stack/M5Unified@^0.1.17
    arduino-libraries/ArduinoHttpClient@^0.6.1
    bblanchon/ArduinoJson@^7.0.0
    paulstoffregen/Time@^1.6.1
    https://github.com/lucadentella/TOTP-Arduino.git
    https://github.com/rpolitex/ArduinoNvs.git
    h2zero/NimBLE-Arduino@^1.4.3

; Build flags
build_flags = 
    -DARDUINO_M5STICK_C
    ; PSRAM support is left off on purpose: nothing here allocates from it, and
    ; linking it in pushes the WiFi + BLE build past the 128KB IRAM limit

[env:m5stick-c-plus-2]
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino

; 8MB Flash partition scheme (Plus 2 only): same app slots as
; min_spiffs.csv, SPIFFS enlarged to 4.125MB for photos. The board
; definition defaults to 4MB Flash, so the upload size is overridden
; here the same way Bruce does for this board.
board_build.partitions = partitions-8mb-photos.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

; Monitor settings
monitor_speed = 115200

; Library dependencies
lib_deps = 
    m5stack/M5Unified@^0.1.17
    arduino-libraries/ArduinoHttpClient@^0.6.1
    bblanchon/ArduinoJson@^7.0.0
    paulstoffregen/Time@^1.6.1
    https://github.com/lucadentella/TOTP-Arduino.git
    https://github.com/rpolitex/ArduinoNvs.git
    h2zero/NimBLE-Arduino@^1.4.3

; Build flags
build_flags = 
    -DARDUINO_M5STICK_C_PLUS_2
    ; PSRAM support is left off on purpose: nothing here allocates from it, and
    ; linking it in pushes the WiFi + BLE build past the 128KB IRAM limit
